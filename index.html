<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로미 PT</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="로미 PT">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html,body{margin:0;height:100%;background:#f7f5fc;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  #app{position:fixed;inset:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);box-sizing:border-box}
  iframe{width:100%;height:100%;border:0;display:block;background:#f7f5fc}
  #load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#6e6880;font-size:14px;background:#f7f5fc;transition:opacity .3s}
  #load img{width:96px;height:96px;border-radius:22px}
  #load a{color:#7c3aed;font-weight:700;display:none}
  #bar{position:fixed;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:9;display:none;
    background:#1e1b2e;color:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:14px;line-height:1.45;max-width:540px;margin:0 auto}
  #bar .row{display:flex;gap:8px;margin-top:10px}
  #bar button{flex:1;border:0;border-radius:10px;padding:10px;font-size:14px;font-weight:700}
  #bar .yes{background:#a78bfa;color:#1a1030}
  #bar .no{background:#3a3550;color:#ddd}
</style>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
</head>
<body>
<div id="app"><iframe id="f" title="로미 PT 예약" allow="clipboard-write"></iframe></div>
<div id="load"><img src="icon-192.png" alt=""><div>불러오는 중…</div><a id="alt" href="#">열리지 않으면 여기를 눌러 주세요</a></div>
<div id="bar"></div>
<script>
  // 구글 웹앱 주소 (/exec 로 끝나는 주소)
  var APP_URL = 'https://script.google.com/macros/s/AKfycbyPg7jqfPL-R-CRsE4_AMDhDUcfDrDmjpjyAD_bVsJeiiYXr3EQwByy2azq8ZqtxKda/exec';

  /* ---------- 예약 화면 띄우기 ---------- */
  var url = APP_URL + (location.search || '');
  var f = document.getElementById('f'), load = document.getElementById('load'), alt = document.getElementById('alt');
  alt.href = url;
  f.addEventListener('load', function(){ load.style.opacity = '0'; setTimeout(function(){ load.style.display = 'none'; }, 300); });
  setTimeout(function(){ alt.style.display = 'block'; }, 8000);
  f.src = url;

  /* ---------- 푸시 알림 ---------- */
  var cfg = self.FIREBASE_CONFIG || {}, vapid = self.FIREBASE_VAPID_KEY || '';
  var cfgOK = !!(cfg.apiKey && cfg.projectId && vapid && window.firebase);
  var supported = ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);
  var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  var child = null, loggedIn = false, token = null, messaging = null, reg = null, regPromise = null;
  var bar = document.getElementById('bar');

  function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){ return null; } }
  function snoozed(k){ var t = Number(store('pt_snooze_' + k) || 0); return Date.now() - t < 3 * 864e5; }
  function snooze(k){ store('pt_snooze_' + k, String(Date.now())); hideBar(); }
  function hideBar(){ bar.style.display = 'none'; }
  function showBar(html){ bar.innerHTML = html; bar.style.display = 'block'; }

  function setupSW(){
    if (!regPromise) regPromise = navigator.serviceWorker.register('firebase-messaging-sw.js').then(function(r){ reg = r; return r; });
    return regPromise;
  }
  function initMessaging(){
    if (messaging || !cfgOK || !supported) return;
    firebase.initializeApp(cfg);
    messaging = firebase.messaging();
    messaging.onMessage(function(p){ // 앱을 켜 둔 상태에서 온 알림
      var n = (p && p.notification) || {};
      setupSW().then(function(r){ r.showNotification(n.title || '로미 PT', { body: n.body || '', icon: 'icon-192.png' }); });
    });
  }
  function fetchToken(){
    if (!cfgOK || !supported || Notification.permission !== 'granted') return;
    initMessaging();
    setupSW().then(function(r){ return messaging.getToken({ vapidKey: vapid, serviceWorkerRegistration: r }); })
      .then(function(t){ if (t) { token = t; sendToken(); } })
      .catch(function(e){ console.warn('push token', e); });
  }
  function sendToken(){ if (child && token && loggedIn) child.postMessage({ type: 'pt-fcm-token', token: token }, '*'); }

  function updateBar(){
    if (!loggedIn || !cfgOK) return hideBar();
    if (!supported) {
      if (isIOS && !standalone && !snoozed('ios')) return showBar('📲 아이폰은 <b>홈 화면에 추가한 앱</b>에서만 알림을 받을 수 있어요. 공유 버튼 → \'홈 화면에 추가\' 후 그 아이콘으로 열어 주세요.<div class="row"><button class="no" data-k="ios">닫기</button></div>');
      return hideBar();
    }
    if (Notification.permission === 'default' && !snoozed('ask'))
      return showBar('🔔 <b>알림을 켜 주세요</b><br>변경 요청, 대기 자리 소식을 바로 알려 드려요.<div class="row"><button class="no" data-k="ask">나중에</button><button class="yes" id="on">알림 켜기</button></div>');
    hideBar();
  }
  bar.addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    if (b.id === 'on') {
      setupSW(); // 미리 등록
      Notification.requestPermission().then(function(p){ if (p === 'granted') fetchToken(); updateBar(); });
    } else if (b.dataset.k) snooze(b.dataset.k);
  });

  window.addEventListener('message', function(e){
    var d = e.data || {};
    if (d.type !== 'pt-hello') return;
    var host = ''; try { host = new URL(e.origin).hostname; } catch(x){}
    if (!/(\.googleusercontent\.com|script\.google\.com)$/.test(host)) return;
    child = e.source; loggedIn = !!d.loggedIn;
    if (token) sendToken(); else fetchToken();
    updateBar();
  });

  if ('serviceWorker' in navigator) setupSW().catch(function(){});
</script>
</body>
</html>
